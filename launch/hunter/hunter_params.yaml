#/*:
#  ros__parameters:
#    use_sim_time: True

$(var namespace):
  #-------------------------------------------------
  # HW DRIVERS
  #-------------------------------------------------
  usb_cam_0:
    usb_cam:
      ros__parameters:
        video_device: "/dev/video4"
        framerate: 5.0
        io_method: "mmap"
        frame_id: "usb_cam_0"
        pixel_format: "mjpeg2rgb" #"yuyv2rgb" #"mjpeg2rgb"  # see usb_cam/supported_formats for list of supported formats
        av_device_format: "YUV422P"
        image_width: 1920 #1280
        image_height: 1080 #720
        camera_name: "usb_cam_0"
        camera_info_url: "package://usb_cam/config/camera_info.yaml"
        brightness: -1
        contrast: -1
        saturation: -1
        sharpness: -1
        gain: -1
        auto_white_balance: true
        white_balance: 4000
        autoexposure: true
        exposure: 100
        autofocus: false
        focus: -1

  usb_cam_1:
    usb_cam:
      ros__parameters:
        video_device: "/dev/video2"
        framerate: 5.0
        io_method: "mmap"
        frame_id: "usb_cam_1"
        pixel_format: "mjpeg2rgb" #"yuyv2rgb" #"mjpeg2rgb"  # see usb_cam/supported_formats for list of supported formats
        av_device_format: "YUV422P"
        image_width: 1920 #1280
        image_height: 1080 #720
        camera_name: "usb_cam_1"
        camera_info_url: "package://usb_cam/config/camera_info.yaml"
        brightness: -1
        contrast: -1
        saturation: -1
        sharpness: -1
        gain: -1
        auto_white_balance: true
        white_balance: 4000
        autoexposure: true
        exposure: 100
        autofocus: false
        focus: -1

  mqtt_bridge:
    ros__parameters:
      host: "150.214.109.137"       # MQTT broker ip
      port: 8002                    # MQTT broker TCP port
      username: ""
      password: ""
      MQTT_namespace: "hunter"        # main topic
      MQTT_topics_subscribe: "ninguno"  # subtopics to listen
      append_timestamp: false
  
  navsat_sender:
    ros__parameters:
      topic: "/hunter/fake_fix"   # topic with the GPS data to tx
  
  nmea_serial_driver:
    ros__parameters:
      port: "/dev/ttyUSB0"
      baud: 4800
      frame_id: "gps_hunter"
      time_ref_source: "gps_frame"
      useRMC: False

  fakeGPS_hunter:
    ros__parameters:
      gps_topic_pub: "fake_fix"
      gps_frame_id: "gps_hunter"
      gps_latitude: 36.71511721
      gps_longitude: -4.4784347
      gps_altitude: 0.0